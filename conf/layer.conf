# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-phyverso-evcs"
BBFILE_PATTERN_meta-phyverso-evcs = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-phyverso-evcs = "23"

BBFILES_DYNAMIC += " \
meta-ti-bsp:${LAYERDIR}/dynamic-layers/meta-ti-bsp/recipes-*/*/*.bb \
meta-ti-bsp:${LAYERDIR}/dynamic-layers/meta-ti-bsp/recipes-*/*/*.bbappend \
"

LAYERSERIES_COMPAT_meta-phyverso-evcs = "scarthgap"

DISTRO_VERSION:am62xx:append = "-phyVERSO-EVCS"
